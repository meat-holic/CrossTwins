name: Compile Release

# Build and verify a draft first. Publishing is a separate final step so the
# release event cannot start a duplicate build or expose incomplete assets.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build and verify
        required: true
        type: string

concurrency:
  group: publish-release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_version: ${{ steps.validate.outputs.release_version }}
      source_commit: ${{ steps.validate.outputs.source_commit }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      rc_build: ${{ steps.validate.outputs.rc_build }}
      release_id: ${{ steps.validate.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate draft, version, and source commit
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python scripts/release_assets.py list --tag "$RELEASE_TAG" >/dev/null
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          release_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" | \
            jq -ce --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("expected exactly one release") end')"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          test "$(jq -r '.assets | length' <<< "$release_json")" = "0"
          prerelease="$(jq -r '.prerelease' <<< "$release_json")"
          version="$(python scripts/release_assets.py validate --tag "$RELEASE_TAG" \
            --configured-version "$configured_version" --prerelease "$prerelease")"

          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          workflow_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$tag_commit" = "$workflow_commit"

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-rc* ]]; then
            echo "rc_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "rc_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_id=$(jq -r '.id' <<< "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Verify logo, release policy, and release tests
        run: |
          python -m pip install 'Pillow==12.3.0'
          python scripts/generate_logo_1bpp.py --check
          python scripts/generate_release_asset_policy.py --check
          python test/test_release_asset_policy.py

  build-release:
    needs: validate-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            rc_env: gh_release_rc
            device: x3-x4
          - release_env: sticky-gh_release
            rc_env: sticky-gh_release_rc
            device: sticky
          - release_env: x4pro-gh_release
            rc_env: x4pro-gh_release_rc
            device: x4pro
          - release_env: x4c-gh_release
            rc_env: x4c-gh_release_rc
            device: x4c
          - release_env: papermono-gh_release
            rc_env: papermono-gh_release_rc
            device: papermono
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.release_tag }}
          submodules: recursive

      - name: Confirm build source commit
        env:
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap is supposed to install them automatically but can miss them.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ needs.validate-release.outputs.rc_build == 'true' && matrix.rc_env || matrix.release_env }}
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossTwins
        env:
          PIO_ENV: ${{ needs.validate-release.outputs.rc_build == 'true' && matrix.rc_env || matrix.release_env }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.release_version }}
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          build_flags="-DCROSSTWINS_USE_BUILD_VERSION=1"
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            build_flags="$build_flags -DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          CROSSPOINT_RELEASE_VERSION="$RELEASE_VERSION" PLATFORMIO_BUILD_FLAGS="$build_flags" \
            pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          PIO_ENV: ${{ needs.validate-release.outputs.rc_build == 'true' && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          asset="$(python scripts/release_assets.py name --tag "$RELEASE_TAG" --device "${{ matrix.device }}")"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  verify-release:
    needs: [validate-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.release_tag }}

      - name: Recheck draft before attaching assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.validate-release.outputs.source_commit }}
          EXPECTED_PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          release_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" | \
            jq -ce --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("expected exactly one release") end')"
          test "$(jq -r '.id' <<< "$release_json")" = "$EXPECTED_RELEASE_ID"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          test "$(jq -r '.prerelease' <<< "$release_json")" = "$EXPECTED_PRERELEASE"
          test "$(jq -r '.assets | length' <<< "$release_json")" = "0"

      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crosstwins-*.bin
          merge-multiple: true

      - name: Verify firmware and prepare manifest
        env:
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.validate-release.outputs.source_commit }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest="dist/crosstwins-${version}-manifest.json"
          python scripts/release_assets.py manifest --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --assets-dir dist --output "$manifest"
          python scripts/release_assets.py verify --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --assets-dir dist --manifest "$manifest"

      - name: Attach firmware assets and manifest to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for asset in dist/crosstwins-*.bin "dist/crosstwins-${version}-manifest.json"; do
            test -f "$asset"
            name="${asset##*/}"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              >/dev/null
          done

      - name: Verify uploaded assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.validate-release.outputs.source_commit }}
          EXPECTED_PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          EXPECTED_RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir verify
          python scripts/release_assets.py list --tag "$RELEASE_TAG" | sort > expected-assets.txt
          printf '%s\n' "crosstwins-${version}-manifest.json" >> expected-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          release_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases" | \
            jq -ce --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("expected exactly one release") end')"
          test "$(jq -r '.id' <<< "$release_json")" = "$EXPECTED_RELEASE_ID"
          jq -r '.assets[].name' <<< "$release_json" | sort > uploaded-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          test "$(jq -r '.prerelease' <<< "$release_json")" = "$EXPECTED_PRERELEASE"
          test "$(jq -r '[.assets[].state] | all(. == "uploaded")' <<< "$release_json")" = "true"

          jq -r '.assets[] | [.id, .name] | @tsv' <<< "$release_json" |
            while IFS=$'\t' read -r asset_id asset_name; do
              curl --fail --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                --output "verify/${asset_name}"
            done
          python scripts/release_assets.py verify --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --assets-dir verify --manifest "verify/crosstwins-${version}-manifest.json"
          echo "Release tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          cat "verify/crosstwins-${version}-manifest.json" >> "$GITHUB_STEP_SUMMARY"
