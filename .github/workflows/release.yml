name: Compile Release

# Build and attach firmware only after a release is published. The release tag
# supplies both the source revision and the version in each asset name.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_env: gh_release
            rc_env: gh_release_rc
            device: x3-x4
          - release_env: sticky-gh_release
            rc_env: sticky-gh_release_rc
            device: sticky
          - release_env: x4pro-gh_release
            rc_env: x4pro-gh_release_rc
            device: x4pro
          - release_env: x4c-gh_release
            rc_env: x4c-gh_release_rc
            device: x4c
          - release_env: papermono-gh_release
            rc_env: papermono-gh_release_rc
            device: papermono
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ "$version" = "2.0.0-rc2.rev.2" ]; then
            test "$RELEASE_TAG" = "v2.0.0-rc2.rev.2"
            test "$RELEASE_PRERELEASE" = "false"
          fi
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            configured_series="${configured_version%%-*}"
            case "$version" in
              "${configured_series}-rc"*) ;;
              *) exit 1 ;;
            esac
            python scripts/release_assets.py list --tag "$RELEASE_TAG" >/dev/null
          else
            test "$version" = "$configured_version"
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify logo and release asset policy
        run: |
          python -m pip install 'Pillow==12.3.0'
          python scripts/generate_logo_1bpp.py --check
          python scripts/generate_release_asset_policy.py --check
          python test/test_release_asset_policy.py

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build CrossTwins
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # Enrollment gate for the LCP service: official releases carry this
          # key, self-builds do not (and lose only LCP). Rotate per release by
          # updating the repo secret; retire old values in the service's
          # RELEASE_KEYS list.
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          CROSSPOINT_RELEASE_VERSION="${RELEASE_TAG#v}" pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          PIO_ENV: ${{ github.event.release.prerelease && matrix.rc_env || matrix.release_env }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="$(python scripts/release_assets.py name --tag "$RELEASE_TAG" --device "${{ matrix.device }}")"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Refuse pre-existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          asset_count="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          test "$asset_count" = "0"

      - name: Download firmware assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: crosstwins-*.bin
          merge-multiple: true

      - name: Verify candidate firmware and prepare manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          version="${RELEASE_TAG#v}"
          manifest="dist/crosstwins-${version}-manifest.json"
          python scripts/release_assets.py manifest --tag "$RELEASE_TAG" --commit "$commit" --assets-dir dist --output "$manifest"
          python scripts/release_assets.py verify --tag "$RELEASE_TAG" --commit "$commit" --assets-dir dist --manifest "$manifest"
          echo "SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Attach firmware assets and manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" dist/crosstwins-*.bin "dist/crosstwins-${version}-manifest.json" \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published asset names and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir verify
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verify \
            --pattern 'crosstwins-*.bin' --pattern 'crosstwins-*-manifest.json'
          python scripts/release_assets.py verify --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --assets-dir verify --manifest "verify/crosstwins-${version}-manifest.json"
          python scripts/release_assets.py list --tag "$RELEASE_TAG" | sort > expected-assets.txt
          printf '%s\n' "crosstwins-${version}-manifest.json" >> expected-assets.txt
          sort -o expected-assets.txt expected-assets.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > published-assets.txt
          diff -u expected-assets.txt published-assets.txt
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "$RELEASE_PRERELEASE"
          cat "verify/crosstwins-${version}-manifest.json" >> "$GITHUB_STEP_SUMMARY"
